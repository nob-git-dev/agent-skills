ont-weight="bold" text-anchor="middle">Tensor Core（2017年 Volta〜）</text><rect x="600" y="140" width="28" height="28" fill="#EA580C" opacity="0.45"/><rect x="630" y="140" width="28" height="28" fill="#EA580C" opacity="0.5700000000000001"/><rect x="660" y="140" width="28" height="28" fill="#EA580C" opacity="0.69"/><rect x="690" y="140" width="28" height="28" fill="#EA580C" opacity="0.81"/><rect x="600" y="170" width="28" height="28" fill="#EA580C" opacity="0.5700000000000001"/><rect x="630" y="170" width="28" height="28" fill="#EA580C" opacity="0.69"/><rect x="660" y="170" width="28" height="28" fill="#EA580C" opacity="0.81"/><rect x="690" y="170" width="28" height="28" fill="#EA580C" opacity="0.45"/><rect x="600" y="200" width="28" height="28" fill="#EA580C" opacity="0.69"/><rect x="630" y="200" width="28" height="28" fill="#EA580C" opacity="0.81"/><rect x="660" y="200" width="28" height="28" fill="#EA580C" opacity="0.45"/><rect x="690" y="200" width="28" height="28" fill="#EA580C" opacity="0.5700000000000001"/><rect x="600" y="230" width="28" height="28" fill="#EA580C" opacity="0.81"/><rect x="630" y="230" width="28" height="28" fill="#EA580C" opacity="0.45"/><rect x="660" y="230" width="28" height="28" fill="#EA580C" opacity="0.5700000000000001"/><rect x="690" y="230" width="28" height="28" fill="#EA580C" opacity="0.69"/><text x="660" y="285" font-size="17" fill="#EA580C" font-weight="bold" text-anchor="middle">4×4 のはんこ</text><text x="830" y="175" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">小さな行列の</text><text x="830" y="200" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">掛け算を丸ごと</text><text x="830" y="225" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">一発で押す</text><text x="750" y="340" font-size="22" fill="#EA580C" font-weight="bold" text-anchor="middle">1サイクルで 64組（＝64倍）</text><text x="500" y="430" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">今の GPU の AI 性能の大部分はこの「
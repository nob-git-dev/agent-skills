line x1="220" y1="259" x2="220" y2="305" stroke="#6B7280" stroke-width="2" stroke-dasharray="4 4"/><rect x="146" y="305" width="148" height="110" rx="10" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/><text x="220" y="333" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">固定機能</text><text x="220" y="361" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">GeForce 256</text><text x="220" y="385" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">手順は回路に焼き付け</text><circle cx="345" cy="250" r="9" fill="#2563EB"/><text x="345" y="285" font-size="18" fill="#2563EB" font-weight="bold" text-anchor="middle">2001</text><line x1="345" y1="241" x2="345" y2="200" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4"/><rect x="271" y="90" width="148" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="345" y="118" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">書けるシェーダー</text><text x="345" y="146" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">GeForce 3（DirectX 8）</text><text x="345" y="170" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">手順をプログラムで</text><circle cx="475" cy="250" r="9" fill="#2563EB"/><text x="475" y="228" font-size="18" fill="#2563EB" font-weight="bold" text-anchor="middle">2006</text><line x1="475" y1="259" x2="475" y2="305" stroke="#2563EB" stroke-width="2" stroke-dasharray="4 4"/><rect x="401" y="305" width="148" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="475" y="333" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">統合シェーダー</text><text x="475" y="361" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">GeForce 8800 GTX</text><text x="475" y="385" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">128個が頂点もピクセルも</text><circle cx="605" cy="250" r="9" fill="#16A34A"/><text x="605" y="285" font-size="18" fill="#16A34A" font-weight="bold" text-anchor="middle">2007</text><line x1="605" y1="241" x2="605" y2="200" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 4"/><rect x="531" y="90" width="148" height="110" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="605" y="118" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">CUDA</text><text x="605" y="146" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">絵でない計算を</text><text x="605" y="170" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">そのまま書ける</text><circle cx="735" cy="250" r="9" fill="#16A34A"/><text x="735" y="228" font-size="18" fill="#16A34A" font-weight="bold" text-anchor="middle">2012</text><line x1="735" y1="259" x2="735" y2="305" stroke="#16A34A" stroke-width="2" stroke-dasharray="4 4"/><rect x="661" y="305" width="148" height="110" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="735" y="333" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">AlexNet</text><text x="735" y="361" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">ゲーム用GPU 2枚で</text><text x="735" y="385" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">画像認識を大差で更新</text><circle cx="870" cy="250" r="9" fill="#EA580C"/><text x="870" y="285" font-size="18" fill="#EA580C" font-weight="bold" text-anchor="middle">2017</text><line x1="870" y1="241" x2="870" y2="200" stroke="#EA580C" stroke-width="2" stroke-dasharray="4 4"/><rect x="796" y="90" width="148" height="110" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text x="870" y="118" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="middle">行列専用の回路</text><text x="870" y="146" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">Tensor Core</text><text x="870" y="170" font-size="12" fill="#1F2937" font-weight="normal" text-anchor="middle">TPU論文・NPU</text><text x="500" y="460" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="middle">灰：絵だけの時代　青：手順を書けるようになる　緑：絵以外へ　橙：行列専用の回路が生まれる</text>

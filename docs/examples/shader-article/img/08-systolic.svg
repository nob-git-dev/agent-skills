途中の合計が流れて答えになる</text><rect x="620" y="110" width="350" height="300" rx="10" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/><text x="640" y="145" font-size="16" fill="#1F2937" font-weight="bold" text-anchor="start">各マスの生徒は本棚に行かない</text><text x="640" y="178" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="start">左から来た数字 × 自分の席の数字</text><text x="640" y="211" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="start">＋ 上から来た途中の合計</text><text x="640" y="244" font-size="16" fill="#2563EB" font-weight="bold" text-anchor="start">→ 右と下へ渡す（バケツリレー）</text><text x="640" y="277" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="start"></text><text x="640" y="310" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="start">65536個 × 7億回/秒 × 2</text><text x="640" y="343" font-size="16" fill="#16A34A" font-weight="bold" text-anchor="start">＝ 約92兆回/秒（92 TOPS）</text><text x="640" y="376" font-size="16" fill="#6B7280" font-weight="normal" text-anchor="start">初代TPU（2015年）は 75W のカード</text><text x="500" y="545" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">「1つの数字を何千回も使い回す」行列の性質を、配線の形そのもので実現した</text>

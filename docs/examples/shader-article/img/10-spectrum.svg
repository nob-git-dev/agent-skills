<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Noto Sans CJK JP">
<rect width="1000" height="480" fill="#FFFFFF"/>
<text x="32" y="48" font-size="26" fill="#1F2937" font-weight="bold" text-anchor="start">まとめ：使い回しをどこで実現するか</text>
<defs><marker id="arr1F2937" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker><marker id="arr6B7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker><marker id="arr2563EB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="arrEA580C" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#EA580C"/></marker><marker id="arr16A34A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16A34A"/></marker><marker id="arr7C3AED" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/></marker></defs><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#16A34A"/></linearGradient></defs><rect x="60" y="150" width="880" height="18" rx="9" fill="url(#g)" stroke="none" stroke-width="2"/><text x="60" y="135" font-size="17" fill="#2563EB" font-weight="bold" text-anchor="start">柔軟（何でも計算できる）</text><text x="940" y="135" font-size="17" fill="#16A34A" font-weight="bold" text-anchor="end">効率（決まった計算を省電力で大量に）</text><circle cx="120" cy="159" r="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/><rect x="25" y="200" width="190" height="160" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><text x="120" y="232" font-size="19" fill="#2563EB" font-weight="bold" text-anchor="middle">シェーダー</text><text x="120" y="270" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">使い回しは</text><text x="120" y="298" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">ソフトの工夫</text><text x="120" y="326" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">（班の机）</text><circle cx="380" cy="159" r="14" fill="#FFFFFF" stroke="#EA580C" stroke-width="4"/><rect x="285" y="200" width="190" height="160" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/><text x="380" y="232" font-size="19" fill="#EA580C" font-weight="bold" text-anchor="middle">Tensor Core</text><text x="380" y="270" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">使い回しは</text><text x="380" y="298" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">はんこの中だけ</text><circle cx="640" cy="159" r="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="4"/><rect x="545" y="200" width="190" height="160" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="640" y="232" font-size="19" fill="#16A34A" font-weight="bold" text-anchor="middle">TPU</text><text x="640" y="270" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">使い回しを</text><text x="640" y="298" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">配線に焼き込む</text><text x="640" y="326" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">（バケツリレー）</text><circle cx="860" cy="159" r="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/><rect x="765" y="200" width="190" height="160" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="860" y="232" font-size="19" fill="#7C3AED" font-weight="bold" text-anchor="middle">NPU</text><text x="860" y="270" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">TPUの考え方を</text><text x="860" y="298" font-size="16" fill="#1F2937" font-weight="normal" text-anchor="middle">小型・低精度に</text><text x="500" y="410" font-size="21" fill="#1F2937" font-weight="bold" text-anchor="middle">違いは「速さ」ではなく「同じ数字を、どこで何回使い回せる形か」</text><text x="500" y="445" font-size="17" fill="#EA580C" font-weight="bold" text-anchor="middle">そしてどれも最後は「本棚から届く速さ」＝メモリ帯域に縛られる</text>
</svg>

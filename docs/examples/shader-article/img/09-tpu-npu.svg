40" y="181" font-size="13" fill="#7C3AED" font-weight="bold" text-anchor="middle">NPU</text><rect x="722" y="225" width="36" height="18" rx="3" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><rect x="722" y="225" width="26" height="18" rx="3" fill="#16A34A" stroke="none" stroke-width="2"/><text x="740" y="300" font-size="18" fill="#1F2937" font-weight="normal" text-anchor="middle">顔認証・写真処理・音声などを</text><text x="740" y="330" font-size="18" fill="#1F2937" font-weight="normal" text-anchor="middle">精度を落として小さく回す</text><text x="740" y="375" font-size="18" fill="#7C3AED" font-weight="bold" text-anchor="middle">目標：電池を減らさないこと</text><text x="500" y="445" font-size="18" fill="#1F2937" font-weight="bold" text-anchor="middle">中身の考え方は同じ側（行列専用の回路）。違うのは目標と割り切りの大きさ</text>
